[package]
name = "fileport-pc"
version = "1.6.0"
description = "Fileport Windows desktop client"
authors = ["Fileport contributors"]
edition = "2021"

[lib]
name = "fileport_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
dirs = "6"
serde_json = "1"
mdns-sd = "0.11"
sha2 = "0.10"

tauri-plugin-notification = "2"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.58", features = ["Devices_Bluetooth_Advertisement", "Storage_Streams", "Foundation", "Foundation_Collections"] }
