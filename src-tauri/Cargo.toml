[package]
name = "fileport-pc"
version = "1.9.1"
description = "Fileport Windows desktop client"
authors = ["Fileport contributors"]
edition = "2021"

[lib]
name = "fileport_pc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
base64 = "0.22"
dirs = "6"
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tempfile = "3"

tauri-plugin-notification = "2"

