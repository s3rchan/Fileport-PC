name: Build Fileport Windows EXE

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish installer to GitHub Releases (tagged with app version)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - "pc-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install JavaScript dependencies
        run: npm install
      - name: Set up Python for brand asset generation
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate official Fileport Windows icons
        run: |
          python -m pip install Pillow==11.3.0
          python scripts/generate_brand_icons.py
          python scripts/install_brand_fonts.py
      - name: Run protocol tests
        run: npm test
      - name: Build NSIS installer
        run: npm run build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fileport-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Validate release tag against app version
        if: startsWith(github.ref, 'refs/tags/pc-v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("pc-v$version" -ne "${{ github.ref_name }}") { throw "Tag and Fileport version do not match: pc-v$version" }
      - name: Publish Fileport Windows release
        if: startsWith(github.ref, 'refs/tags/pc-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fileport PC ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true

      - name: Publish Fileport Windows release from manual run
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "pc-v$version"
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($files.Count -eq 0) { throw "No Windows installer was built" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($files.FullName) --clobber
          } else {
            gh release create $tag @($files.FullName) --target "${{ github.sha }}" --title "Fileport PC v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release" }
