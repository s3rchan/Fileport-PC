name: Build Fileport Windows EXE

on:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish installer to GitHub Releases (tagged with app version)'
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
    tags:
      - "pc-v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Verify committed Windows icons are available to bare Rust/Tauri builds
        shell: pwsh
        run: |
          if (!(Test-Path src-tauri/icons/icon.ico) -or !(Test-Path src-tauri/icons/icon.png)) { throw "Committed Fileport Windows icons are missing" }
      - name: Set up Python for offline Open Sauce font bundling
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle offline Open Sauce fonts
        run: python scripts/install_brand_fonts.py
      - name: Verify release version consistency
        run: python scripts/bump_version.py --check
      - name: Run protocol tests
        run: npm test
      - name: Build NSIS installer
        run: npm run build -- --bundles nsis
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Fileport-Windows-Installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Validate release tag against app version
        if: startsWith(github.ref, 'refs/tags/pc-v')
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          if ("pc-v$version" -ne "${{ github.ref_name }}") { throw "Tag and Fileport version do not match: pc-v$version" }
      - name: Publish Fileport Windows release
        if: startsWith(github.ref, 'refs/tags/pc-v')
        uses: softprops/action-gh-release@v2
        with:
          name: Fileport PC ${{ github.ref_name }}
          generate_release_notes: true
          files: src-tauri/target/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true

      - name: Publish Fileport Windows release from tagged merge or manual run
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.publish_release) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/main' &&
          startsWith(github.event.head_commit.message, 'release: Fileport PC v1.9.4'))
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          $tag = "pc-v$version"
          $files = @(Get-ChildItem "src-tauri/target/release/bundle/nsis/*.exe" -File)
          if ($files.Count -eq 0) { throw "No Windows installer was built" }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag @($files.FullName) --clobber
          } else {
            gh release create $tag @($files.FullName) --target "${{ github.sha }}" --title "Fileport PC v$version" --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish GitHub Release" }
